site_name: Infra Knowledge
site_description: AI 基础设施、NPU 架构、数据搬运与高性能网络学习笔记。
site_author: Infra Knowledge contributors
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "http://127.0.0.1:8000"]
repo_url: https://github.com/nbbb24/Infra-Knowledge
repo_name: nbbb24/Infra-Knowledge
edit_uri: edit/main/docs/zh/
docs_dir: docs/zh

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 首页: index.md
  - 基础知识:
      - NPU 硬件与层级: npu/mental-model.md
      - 核心术语: npu/glossary.md
  - 数据与通信:
      - 数据搬运与 H2D: npu/data-movement.md
      - 网络平面与出框口: npu/network-planes.md
      - 互联、协议与通信软件: npu/interconnects.md
      - 内存、NUMA 与地址: npu/memory-addressing.md
  - 实践:
      - 一次端到端数据传输: npu/end-to-end-transfer.md
      - 性能分析与常用工具: npu/performance-tools.md

extra:
  alternate:
    - name: 简体中文
      link: ./
      lang: zh

copyright: Copyright &copy; Infra Knowledge contributors
