site_name: Infra Knowledge
site_description: Bilingual notes on AI infrastructure, NPU architecture, data movement, and networking.
site_author: Infra Knowledge contributors
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "http://127.0.0.1:8000"]
repo_url: https://github.com/nbbb24/Infra-Knowledge
repo_name: nbbb24/Infra-Knowledge
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 首页 / Home: index.md
  - 中文:
      - 学习路线: zh/index.md
      - 一张图理解 NPU: zh/npu/mental-model.md
      - 核心术语: zh/npu/glossary.md
      - 数据搬运与 H2D: zh/npu/data-movement.md
      - 网络平面与出框口: zh/npu/network-planes.md
  - English:
      - Learning path: en/index.md
      - NPU mental model: en/npu/mental-model.md
      - Core glossary: en/npu/glossary.md
      - Data movement and H2D: en/npu/data-movement.md
      - Network planes and uplinks: en/npu/network-planes.md

copyright: Copyright &copy; Infra Knowledge contributors
